# osv-scanner の既知脆弱性 ignore 設定。
#
# `.github/workflows/reusable-osv-scan.yml`（keroway/.github）が `osv-scanner scan source
# --recursive .` を実行する際にこのファイルを読み込む。ここに列挙するのは、修正版が
# 現時点でまだリリースされていない（FIXED VERSION が存在しない）脆弱性のみ。npm 側の
# `brace-expansion`（GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895）は修正版が存在するため
# `apps/webui/package.json` の `overrides` フィールドで解消済み、ここには含めない
# （issue #731）。

