# keroway 標準 lefthook 設定（Rust workspace + apps/webui）。
# https://lefthook.dev/configuration/
#
# 導入: `lefthook install` を一度実行する（git hooks が登録される）。
# WebUI は apps/webui/biome.json で Biome の lint/format を有効化しているため、
# ここでも `npm run lint` に委譲する（実体は Biome。ルート biome.json は無効化のまま、
# 他ツール向けのデフォルト）。

pre-commit:
  parallel: true
  jobs:
    - name: cargo fmt (check)
      glob: "*.rs"
      run: cargo fmt --all -- --check

    - name: webui lint (biome)
      glob: "apps/webui/**/*.{ts,tsx,js,mjs}"
      run: npm --prefix apps/webui run lint

pre-push:
  jobs:
    # 重いテストは pre-push でのみ実行する。
    - name: cargo test
      run: cargo test --workspace --all-targets
