[package]
name = "tdsl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core IR and lowering logic for the Timeline DSL compiler"
repository.workspace = true
keywords = ["timeline", "dsl", "compiler", "ir"]
categories = ["compilers"]

[features]
default = ["wikidata"]
wikidata = ["dep:tdsl-wikidata", "dep:tokio"]

[dependencies]
tdsl-parser = { path = "../tdsl-parser", version = "1.25.0" }
tdsl-wikidata = { path = "../tdsl-wikidata", version = "1.25.0", optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
miette.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
insta = { version = "1", features = ["yaml", "json"] }
async-trait = "0.1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "lower_bench"
harness = false
