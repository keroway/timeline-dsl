[package]
name = "tdsl-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the Timeline DSL compiler (static compile + SVG/HTML render)"
repository = "https://github.com/keroway/timeline-dsl"
homepage = "https://github.com/keroway/timeline-dsl"
keywords = ["timeline", "wasm", "dsl", "svg", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
tdsl-parser = { path = "../tdsl-parser" }
tdsl-core = { path = "../tdsl-core", default-features = false }
tdsl-render = { path = "../tdsl-render" }
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]
