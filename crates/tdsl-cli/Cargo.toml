[package]
name = "tdsl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tdsl"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tdsl-{ target }.tar.gz"
bin-dir = "tdsl{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides."x86_64-unknown-linux-musl"]
pkg-url = "{ repo }/releases/download/v{ version }/tdsl-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides."x86_64-apple-darwin"]
pkg-url = "{ repo }/releases/download/v{ version }/tdsl-macos-x86_64.tar.gz"

[package.metadata.binstall.overrides."aarch64-apple-darwin"]
pkg-url = "{ repo }/releases/download/v{ version }/tdsl-macos-aarch64.tar.gz"

[dependencies]
tdsl-parser = { path = "../tdsl-parser" }
tdsl-core = { path = "../tdsl-core", features = ["wikidata"] }
tdsl-wikidata = { path = "../tdsl-wikidata" }
tdsl-render = { path = "../tdsl-render", features = ["png", "pdf"] }
tdsl-lsp = { path = "../tdsl-lsp" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde.workspace = true
serde_json.workspace = true
miette = { version = "7", features = ["fancy"] }
tokio.workspace = true
csv = "1"
indicatif = "0.18"
