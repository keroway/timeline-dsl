version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # SVG レンダリングスタック（resvg / svg2pdf / pdf-writer）は lockstep で更新する。
      #   - svg2pdf が返す Chunk の Ref と自前 pdf-writer の Ref を混在させるため、
      #     svg2pdf ↔ pdf-writer のバージョンは必ず一致させる必要がある（不一致だと
      #     pdf_writer の二重リンクで型不一致になりビルドが落ちる）。
      #   - usvg 型ツリーを resvg と svg2pdf で共有するため、両者の usvg 世代も揃える
      #     （ADR-0002 D2 / crates/tdsl-render/Cargo.toml のコメント参照）。
      # 一部だけ dependabot に単独 bump させると逆向きの不整合が起きるため、3 者とも
      # minor/major 更新を抑止し、互換を確認のうえ手動でまとめて引き上げる。patch は許可。
      - dependency-name: "pdf-writer"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "svg2pdf"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "resvg"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
