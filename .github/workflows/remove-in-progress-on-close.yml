name: Remove in-progress label on close

on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to strip the in-progress label from
        required: true
        type: number

permissions:
  issues: write
  pull-requests: read

jobs:
  remove-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const LABEL = "in-progress";
            const { owner, repo } = context.repo;

            const removeLabel = async (issueNumber) => {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issueNumber, name: LABEL,
                });
              } catch (err) {
                if (err.status === 404) return;
                throw err;
              }
            };

            if (context.eventName === "workflow_dispatch") {
              const n = Number(context.payload.inputs.issue_number);
              if (!Number.isFinite(n) || n <= 0) {
                core.setFailed("Invalid issue_number");
                return;
              }
              await removeLabel(n);
              return;
            }

            if (context.eventName === "issues") {
              await removeLabel(context.issue.number);
              return;
            }

            const pr = context.payload.pull_request;
            if (!pr || !pr.merged) return;

            const body = (pr.body || "")
              .replace(/```[\s\S]*?```/g, "")
              .replace(/`[^`\n]*`/g, "")
              .replace(/^\s*>.*$/gm, "");
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;
            const numbers = new Set();
            for (const m of body.matchAll(re)) numbers.add(Number(m[1]));
            for (const n of numbers) await removeLabel(n);
