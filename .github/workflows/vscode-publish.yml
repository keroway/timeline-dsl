name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] — push:tags のみでトリガーされ pull_request トリガーは無い
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install vsce
        # zizmor: ignore[adhoc-packages] — CLI ツールのグローバルインストール。
        # editors/vscode/package.json の devDependency バージョンとバージョンを揃えて固定済み
        run: npm install -g @vscode/vsce@3.9.2

      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Verify package.json version matches tag
        working-directory: editors/vscode
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match editors/vscode/package.json version ($PKG_VERSION)."
            echo "::error::Bump editors/vscode/package.json before tagging the release."
            exit 1
          fi

      - name: Test extension
        working-directory: editors/vscode
        run: npm test

      - name: Package extension
        working-directory: editors/vscode
        run: vsce package

      - name: Upload VSIX to GitHub Release
        # release.yml と別ワークフローのため release 有無が不定。softprops は
        # 「無ければ作成・あれば追記」を単一ステップで担うため `gh release` script に
        # 単純置換しない（同等の分岐を書くと複雑化する）。
        # zizmor: ignore[superfluous-actions] — 上記理由により意図的に維持
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: editors/vscode/*.vsix

      - name: Publish to Marketplace
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish --pat "$VSCE_PAT"
