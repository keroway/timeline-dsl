name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "npm に publish する version（例: 1.10.0、v プレフィックスなし）"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tdsl-linux-x86_64.tar.gz
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tdsl-linux-aarch64.tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tdsl-macos-x86_64.tar.gz
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tdsl-macos-aarch64.tar.gz
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: tdsl-windows-x86_64.zip
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml の存在下では dtolnay/rust-toolchain の `targets:` が
      # 反映されない場合があるため、明示的に rustup target add で保証する。
      - name: Ensure target installed
        if: "!matrix.use_cross"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p tdsl-cli

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p tdsl-cli

      - name: Strip binary (macOS)
        if: "!matrix.use_cross && matrix.os == 'macos-latest'"
        run: strip target/${{ matrix.target }}/release/tdsl

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release tdsl

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\tdsl.exe -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  build-wasm:
    name: Build WASM package
    runs-on: ubuntu-latest
    # npm への publish は Trusted Publishing（OIDC）で行う。長期トークン（NPM_TOKEN）は不要。
    # OIDC トークン発行のため id-token: write が必須。このジョブは checkout と artifact
    # アップロードしか行わないため、最小権限として contents: read のみ併記する
    # （job-level permissions は top-level を上書きするため明示が必要）。
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build WASM (web target)
        run: wasm-pack build crates/tdsl-wasm --target web --release --scope keroway

      - name: Smoke test — check_source returns JSON array
        run: |
          node -e "
          const {readFileSync} = require('fs');
          // Minimal smoke: ensure the generated JS module exports the expected symbols
          const js = readFileSync('crates/tdsl-wasm/pkg/tdsl_wasm.js', 'utf8');
          ['compile_to_ir', 'render_svg_from_source', 'render_html_from_source', 'check_source', 'lint_source', 'lint_fix_source']
            .forEach(fn => { if (!js.includes(fn)) throw new Error('Missing export: ' + fn); });
          console.log('WASM smoke test passed');
          "

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "value=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package WASM bundle
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.value }}"
          cd crates/tdsl-wasm/pkg
          # npm パッケージページ用の README とライセンスを同梱する。
          # README はクレート直下のものを wasm-pack が pkg/ にコピーするが、
          # 確実性のため明示コピーし、LICENSE はリポジトリ root から持ち込む。
          # npm publish は files 配列に関わらず README / LICENSE を常に同梱する。
          cp ../README.md README.md
          cp ../../../LICENSE LICENSE
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '${VERSION}';
          pkg.publishConfig = { access: 'public' };
          pkg.bugs = { url: 'https://github.com/keroway/timeline-dsl/issues' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          tar czf "../../../tdsl-wasm-${TAG}.tar.gz" \
            tdsl_wasm.js \
            tdsl_wasm.d.ts \
            tdsl_wasm_bg.wasm \
            tdsl_wasm_bg.wasm.d.ts \
            package.json \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdsl-wasm-${{ steps.version.outputs.tag }}.tar.gz
          path: tdsl-wasm-${{ steps.version.outputs.tag }}.tar.gz

      - name: Publish to npm (Trusted Publishing / OIDC)
        # 認証は id-token: write による OIDC で自動取得され、NODE_AUTH_TOKEN は不要。
        # provenance attestation も自動付与される。
        # Trusted Publishing は npm CLI 11.5.1 以降が必須なので、publish 直前に最新へ更新する。
        # npm 更新・Trusted Publisher 未設定・npm 障害のいずれの失敗でも GitHub Release /
        # Homebrew 更新をブロックしないよう、更新と publish を 1 ステップにまとめて
        # continue-on-error にする（失敗時はこのステップが赤くなり気付ける）。
        continue-on-error: true
        run: |
          npm install -g npm@latest
          cd crates/tdsl-wasm/pkg
          npm publish --access public

  publish-crates:
    name: Publish core crates to crates.io
    # タグ push 時のみ実行する。workflow_dispatch は npm 再 publish 用のため対象外。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # crates.io への publish は Trusted Publishing（OIDC）で行う。長期トークンは不要。
    # OIDC トークン発行のため id-token: write が必須。このジョブは checkout と
    # cargo publish しか行わないため、最小権限として contents: read のみ併記する
    # （job-level permissions は top-level を上書きするため明示が必要）。
    permissions:
      id-token: write
      contents: read
    # crates.io publish の失敗（Trusted Publisher 未設定・crates.io 障害等）が
    # GitHub Release / npm / Homebrew をブロックしないよう continue-on-error にする。
    # 他ジョブから needs されない独立ジョブ（失敗時はこのジョブが赤くなり気付ける）。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates

      # vscode-publish.yml の package.json 整合チェックと同趣旨。
      # workspace version と git tag が不一致のまま publish しないようにする。
      - name: Verify workspace version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WS_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tdsl-core") | .version')
          if [ "$TAG_VERSION" != "$WS_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match workspace version ($WS_VERSION)."
            echo "::error::Bump [workspace.package].version in Cargo.toml before tagging the release."
            exit 1
          fi

      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # cargo 1.90+ の multi-package publish は依存順（parser/wikidata → core → render）を
      # 自動解決するため、明示的な順序制御や crates.io 反映待ちのスリープは不要。
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p tdsl-parser -p tdsl-wikidata -p tdsl-core -p tdsl-render --locked

  release:
    name: GitHub Release
    needs: [build, build-wasm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            tdsl-linux-x86_64.tar.gz
            tdsl-linux-aarch64.tar.gz
            tdsl-macos-x86_64.tar.gz
            tdsl-macos-aarch64.tar.gz
            tdsl-windows-x86_64.zip
            tdsl-wasm-${{ github.ref_name }}.tar.gz
          generate_release_notes: true

  update-homebrew-formula:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Compute SHA256 hashes
        id: sha256
        run: |
          echo "linux_x86_64=$(sha256sum tdsl-linux-x86_64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_aarch64=$(sha256sum tdsl-linux-aarch64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "macos_x86_64=$(sha256sum tdsl-macos-x86_64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "macos_aarch64=$(sha256sum tdsl-macos-aarch64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout formula repo
        uses: actions/checkout@v6
        with:
          repository: keroway/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Regenerate formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA_LINUX: ${{ steps.sha256.outputs.linux_x86_64 }}
          SHA_LINUX_ARM: ${{ steps.sha256.outputs.linux_aarch64 }}
          SHA_MACOS_X86: ${{ steps.sha256.outputs.macos_x86_64 }}
          SHA_MACOS_ARM: ${{ steps.sha256.outputs.macos_aarch64 }}
        run: |
          # formula 全体を毎回生成する。旧 sed+PLACEHOLDER 方式は一度埋めると
          # placeholder が消え、以降は version しか書き換わらず sha が stale に
          # なる欠陥があった。全プラットフォームの url/sha を決定的に書き出す。
          TAG="${VERSION#v}"
          cat > homebrew-tap/Formula/tdsl.rb <<FORMULA
          class Tdsl < Formula
            desc "Timeline DSL compiler — text-based timelines with Wikidata import"
            homepage "https://github.com/keroway/timeline-dsl"
            version "${TAG}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/keroway/timeline-dsl/releases/download/v#{version}/tdsl-macos-aarch64.tar.gz"
                sha256 "${SHA_MACOS_ARM}"
              else
                url "https://github.com/keroway/timeline-dsl/releases/download/v#{version}/tdsl-macos-x86_64.tar.gz"
                sha256 "${SHA_MACOS_X86}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/keroway/timeline-dsl/releases/download/v#{version}/tdsl-linux-aarch64.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://github.com/keroway/timeline-dsl/releases/download/v#{version}/tdsl-linux-x86_64.tar.gz"
                sha256 "${SHA_LINUX}"
              end
            end

            def install
              bin.install "tdsl"
            end

            test do
              assert_match "tdsl", shell_output("#{bin}/tdsl --version")
              (testpath/"test.tdsl").write <<~EOS
                timeline "test" {
                  unit year;
                  range 1..100;
                }
                lane "main" as main { kind dynasty; order 1; }
                span main 10..50 "test span" {};
              EOS
              assert_match "lanes", shell_output("#{bin}/tdsl build #{testpath}/test.tdsl --pretty")
            end
          end
          FORMULA

      - name: Commit and push formula update
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tdsl.rb
          git commit -m "chore: update tdsl formula to ${{ github.ref_name }}"
          git push
