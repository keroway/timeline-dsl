name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "npm に publish する version（例: 1.10.0、v プレフィックスなし）"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tdsl-linux-x86_64.tar.gz
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tdsl-linux-aarch64.tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tdsl-macos-x86_64.tar.gz
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tdsl-macos-aarch64.tar.gz
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: tdsl-windows-x86_64.zip
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA ピン。toolchain は with: で指定)
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}

      # rust-toolchain.toml の存在下では dtolnay/rust-toolchain の `targets:` が
      # 反映されない場合があるため、明示的に rustup target add で保証する。
      - name: Ensure target installed
        if: "!matrix.use_cross"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Cache Cargo
        # zizmor: ignore[cache-poisoning] — push:tags のみでトリガーされ pull_request トリガーは無い
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p tdsl-cli

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p tdsl-cli

      - name: Strip binary (macOS)
        if: "!matrix.use_cross && matrix.os == 'macos-latest'"
        run: strip target/${{ matrix.target }}/release/tdsl

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release tdsl

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\tdsl.exe -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  build-wasm:
    name: Build WASM package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # npm への publish は Trusted Publishing（OIDC）で行う。長期トークン（NPM_TOKEN）は不要。
    # OIDC トークン発行のため id-token: write が必須。このジョブは checkout と artifact
    # アップロードしか行わないため、最小権限として contents: read のみ併記する
    # （job-level permissions は top-level を上書きするため明示が必要）。
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA ピン。toolchain は with: で指定)
        with:
          toolchain: "1.94"

      - name: Cache Cargo
        # zizmor: ignore[cache-poisoning] — push:tags のみでトリガーされ pull_request トリガーは無い
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: wasm-pack@0.14.0

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] — push:tags のみでトリガーされ pull_request トリガーは無い
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build WASM (web target)
        run: wasm-pack build crates/tdsl-wasm --target web --release --scope keroway

      - name: Smoke test — check_source returns JSON array
        run: |
          node -e "
          const {readFileSync} = require('fs');
          // Minimal smoke: ensure the generated JS module exports the expected symbols
          const js = readFileSync('crates/tdsl-wasm/pkg/tdsl_wasm.js', 'utf8');
          ['compile_to_ir', 'render_svg_from_source', 'render_html_from_source', 'check_source', 'lint_source', 'lint_fix_source']
            .forEach(fn => { if (!js.includes(fn)) throw new Error('Missing export: ' + fn); });
          console.log('WASM smoke test passed');
          "

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "value=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package WASM bundle
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cd crates/tdsl-wasm/pkg
          # npm パッケージページ用の README とライセンスを同梱する。
          # README はクレート直下のものを wasm-pack が pkg/ にコピーするが、
          # 確実性のため明示コピーし、LICENSE はリポジトリ root から持ち込む。
          # npm publish は files 配列に関わらず README / LICENSE を常に同梱する。
          cp ../README.md README.md
          cp ../../../LICENSE LICENSE
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '${VERSION}';
          pkg.publishConfig = { access: 'public' };
          pkg.bugs = { url: 'https://github.com/keroway/timeline-dsl/issues' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          tar czf "../../../tdsl-wasm-${TAG}.tar.gz" \
            tdsl_wasm.js \
            tdsl_wasm.d.ts \
            tdsl_wasm_bg.wasm \
            tdsl_wasm_bg.wasm.d.ts \
            package.json \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tdsl-wasm-${{ steps.version.outputs.tag }}.tar.gz
          path: tdsl-wasm-${{ steps.version.outputs.tag }}.tar.gz

      - name: Publish to npm (Trusted Publishing / OIDC)
        # 認証は id-token: write による OIDC で自動取得され、NODE_AUTH_TOKEN は不要。
        # provenance attestation も自動付与される。
        # Trusted Publishing は npm CLI 11.5.1 以降が必須なので、publish 直前に最新へ更新する。
        # npm 更新・Trusted Publisher 未設定・npm 障害のいずれの失敗でも GitHub Release /
        # Homebrew 更新をブロックしないよう、更新と publish を 1 ステップにまとめて
        # continue-on-error にする（失敗時はこのステップが赤くなり気付ける）。
        # zizmor: ignore[adhoc-packages] — 上記コメントの通り、Trusted Publishing 要件を
        # 満たすため意図的に常に最新の npm へ更新する。バージョン固定は本来の目的に反する
        continue-on-error: true
        run: |
          npm install -g npm@latest
          cd crates/tdsl-wasm/pkg
          npm publish --access public

  publish-crates:
    name: Publish core crates to crates.io
    # タグ push 時のみ実行する。workflow_dispatch は npm 再 publish 用のため対象外。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # crates.io への publish は Trusted Publishing（OIDC）で行う。長期トークンは不要。
    # OIDC トークン発行のため id-token: write が必須。このジョブは checkout と
    # cargo publish しか行わないため、最小権限として contents: read のみ併記する
    # （job-level permissions は top-level を上書きするため明示が必要）。
    permissions:
      id-token: write
      contents: read
    # crates.io publish の失敗（Trusted Publisher 未設定・crates.io 障害等）が
    # GitHub Release / npm / Homebrew をブロックしないよう continue-on-error にする。
    # 他ジョブから needs されない独立ジョブ（失敗時はこのジョブが赤くなり気付ける）。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA ピン。toolchain は with: で指定)
        with:
          toolchain: "1.94"

      - name: Cache Cargo
        # zizmor: ignore[cache-poisoning] — push:tags のみでトリガーされ pull_request トリガーは無い
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: publish-crates

      # vscode-publish.yml の package.json 整合チェックと同趣旨。
      # workspace version と git tag が不一致のまま publish しないようにする。
      - name: Verify workspace version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WS_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tdsl-core") | .version')
          if [ "$TAG_VERSION" != "$WS_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match workspace version ($WS_VERSION)."
            echo "::error::Bump [workspace.package].version in Cargo.toml before tagging the release."
            exit 1
          fi

      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # cargo 1.90+ の multi-package publish は依存順（parser/wikidata → core → render）を
      # 自動解決するため、明示的な順序制御や crates.io 反映待ちのスリープは不要。
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p tdsl-parser -p tdsl-wikidata -p tdsl-core -p tdsl-render --locked

  release:
    name: GitHub Release
    needs: [build, build-wasm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 同じタグ push で vscode-publish.yml も走り、softprops/action-gh-release で
          # 同名の Release を「無ければ作成」する。VS Code 側は数分で終わるのに対し
          # こちらはクロスビルドに10分以上かかるため、構造的にあちらが先着する。
          # `gh release create` 固定だと "already exists" で必ず失敗し、後続の
          # update-homebrew-formula が skip されて Homebrew だけ更新されない
          # （v2.0.0 / v2.1.0 で実際に発生）。既存なら asset 追加に切り替えて冪等にする。
          assets=(
            tdsl-linux-x86_64.tar.gz
            tdsl-linux-aarch64.tar.gz
            tdsl-macos-x86_64.tar.gz
            tdsl-macos-aarch64.tar.gz
            tdsl-windows-x86_64.zip
            "tdsl-wasm-${TAG}.tar.gz"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; uploading assets to it."
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            gh release create "$TAG" --generate-notes "${assets[@]}"
          fi

  update-homebrew-formula:
    name: Update Homebrew Formula (tap bump PR)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # keroway/homebrew-tap へのクロスリポジトリ操作には PAT（TAP_BUMP_TOKEN）が必要。
      # 未設定を skip として success 扱いにすると配達漏れが誰にも気づかれない
      # （実際に v1.28.0 で発生した）。設定済みが前提のため、無ければ fail させる。
      - name: Check tap bump token
        env:
          TAP_BUMP_TOKEN: ${{ secrets.TAP_BUMP_TOKEN }}
        run: |
          if [ -z "$TAP_BUMP_TOKEN" ]; then
            echo "::error::TAP_BUMP_TOKEN secret is not set; Homebrew tap bump cannot run." >&2
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Compute SHA256 hashes
        id: sha256
        run: |
          {
            echo "linux_x86_64=$(sha256sum tdsl-linux-x86_64.tar.gz | awk '{print $1}')"
            echo "linux_aarch64=$(sha256sum tdsl-linux-aarch64.tar.gz | awk '{print $1}')"
            echo "macos_x86_64=$(sha256sum tdsl-macos-x86_64.tar.gz | awk '{print $1}')"
            echo "macos_aarch64=$(sha256sum tdsl-macos-aarch64.tar.gz | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout formula repo
        # zizmor: ignore[artipacked] — 後続の `git push` が checkout の persist された
        # 認証情報（TAP_BUMP_TOKEN）に依存しているため意図的に persist-credentials を残す
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keroway/homebrew-tap
          token: ${{ secrets.TAP_BUMP_TOKEN }}
          path: homebrew-tap

      - name: Regenerate formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA_LINUX: ${{ steps.sha256.outputs.linux_x86_64 }}
          SHA_LINUX_ARM: ${{ steps.sha256.outputs.linux_aarch64 }}
          SHA_MACOS_X86: ${{ steps.sha256.outputs.macos_x86_64 }}
          SHA_MACOS_ARM: ${{ steps.sha256.outputs.macos_aarch64 }}
        run: |
          # formula 全体を毎回生成する。旧 sed+PLACEHOLDER 方式は一度埋めると
          # placeholder が消え、以降は version しか書き換わらず sha が stale に
          # なる欠陥があった。全プラットフォームの url/sha を決定的に書き出す。
          #
          # `version` は宣言しない。Homebrew は url のパスからバージョンを読むため、
          # 併記すると `brew audit` が "version X is redundant with version scanned
          # from URL" で落ち、tap 側の test-bot が失敗する（v2.1.0 で発生）。
          # url にはタグを直書きする（keroway/homebrew-tap の CLAUDE.md の手順どおり）。
          #
          # 構造（caveats / 補完 / test）もここが正典。生成物で formula 全体を上書きするため、
          # tap 側で公式を拡張したら必ずこの heredoc に同期しないと次回リリースで消える。
          # （v2.1.0 で caveats / generate_completions / test 拡張が消えた事例。keroway/homebrew-tap#97）
          # caveats 中の `tdsl` は非クォート heredoc のため \` でエスケープ必須。
          TAG="${VERSION#v}"
          cat > homebrew-tap/Formula/tdsl.rb <<FORMULA
          class Tdsl < Formula
            desc "Timeline DSL compiler — text-based timelines with Wikidata import"
            homepage "https://github.com/keroway/timeline-dsl"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/keroway/timeline-dsl/releases/download/v${TAG}/tdsl-macos-aarch64.tar.gz"
                sha256 "${SHA_MACOS_ARM}"
              else
                url "https://github.com/keroway/timeline-dsl/releases/download/v${TAG}/tdsl-macos-x86_64.tar.gz"
                sha256 "${SHA_MACOS_X86}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/keroway/timeline-dsl/releases/download/v${TAG}/tdsl-linux-aarch64.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://github.com/keroway/timeline-dsl/releases/download/v${TAG}/tdsl-linux-x86_64.tar.gz"
                sha256 "${SHA_LINUX}"
              end
            end

            def install
              bin.install "tdsl"
              generate_completions_from_executable(bin/"tdsl", "completions")
            end

            def caveats
              <<~EOS
                Bash, zsh, and fish completions for \`tdsl\` were generated, but Homebrew
                does not auto-link completions from external taps by default. Run this
                once to enable them:
                  brew completions link
              EOS
            end

            test do
              assert_match "tdsl", shell_output("#{bin}/tdsl --version")
              (testpath/"test.tdsl").write <<~EOS
                timeline "test" {
                  unit year;
                  range 1..100;
                }
                lane "main" as main { kind dynasty; order 1; }
                span main 10..50 "test span" {};
              EOS
              assert_match "lanes", shell_output("#{bin}/tdsl build #{testpath}/test.tdsl --pretty")

              system bin/"tdsl", "render", testpath/"test.tdsl", "-o", testpath/"out.html"
              assert_path_exists testpath/"out.html"
              assert_match "<svg", (testpath/"out.html").read

              assert_path_exists bash_completion/"tdsl"
              assert_path_exists zsh_completion/"_tdsl"
              assert_path_exists fish_completion/"tdsl.fish"
            end
          end
          FORMULA

      # 直 push ではなく PR を作成する（tap 側の CI / レビューを経由できるように）。
      # バージョン文字列は injection 対策として必ず env 経由で渡す。
      - name: Create tap bump PR
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_BUMP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          TAG="${VERSION#v}"
          BRANCH="bump-tdsl-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add Formula/tdsl.rb
          if git diff --cached --quiet; then
            echo "::notice::Formula is already up to date; skipping PR creation."
            exit 0
          fi
          git commit -m "chore: update tdsl formula to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --repo keroway/homebrew-tap \
            --head "$BRANCH" \
            --title "chore: update tdsl formula to ${VERSION}" \
            --body "Automated bump from keroway/timeline-dsl release ${VERSION}. Regenerates Formula/tdsl.rb with the new version and sha256 hashes for all platforms."
