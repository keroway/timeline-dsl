name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tdsl-linux-x86_64.tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tdsl-macos-x86_64.tar.gz
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tdsl-macos-aarch64.tar.gz
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p tdsl-cli

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p tdsl-cli

      - name: Strip binary (Linux)
        if: matrix.use_cross
        run: strip target/${{ matrix.target }}/release/tdsl

      - name: Strip binary (macOS)
        if: "!matrix.use_cross"
        run: strip target/${{ matrix.target }}/release/tdsl

      - name: Create archive
        run: |
          tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release tdsl

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            tdsl-linux-x86_64.tar.gz
            tdsl-macos-x86_64.tar.gz
            tdsl-macos-aarch64.tar.gz
          generate_release_notes: true

  update-homebrew-formula:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Compute SHA256 hashes
        id: sha256
        run: |
          echo "linux_x86_64=$(sha256sum tdsl-linux-x86_64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "macos_x86_64=$(sha256sum tdsl-macos-x86_64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "macos_aarch64=$(sha256sum tdsl-macos-aarch64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout formula repo
        uses: actions/checkout@v6
        with:
          repository: keroway/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA_LINUX: ${{ steps.sha256.outputs.linux_x86_64 }}
          SHA_MACOS_X86: ${{ steps.sha256.outputs.macos_x86_64 }}
          SHA_MACOS_ARM: ${{ steps.sha256.outputs.macos_aarch64 }}
        run: |
          TAG="${VERSION#v}"
          sed -i \
            -e "s/version \"[^\"]*\"/version \"${TAG}\"/" \
            -e "s/PLACEHOLDER_LINUX_X86_64_SHA256/${SHA_LINUX}/" \
            -e "s/PLACEHOLDER_MACOS_X86_64_SHA256/${SHA_MACOS_X86}/" \
            -e "s/PLACEHOLDER_MACOS_AARCH64_SHA256/${SHA_MACOS_ARM}/" \
            homebrew-tap/Formula/tdsl.rb

      - name: Commit and push formula update
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tdsl.rb
          git commit -m "chore: update tdsl formula to ${{ github.ref_name }}"
          git push
