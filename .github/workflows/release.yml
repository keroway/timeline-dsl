# Publication uses only a verified existing tag SHA. Keep destination failures visible.
name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to retry (vX.Y.Z); no version rewriting
        required: true
        type: string
concurrency:
  group: release-workflow-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    # Manual retries run orchestration from the repository default branch only.
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify existing tag and all package versions
      run: python3 scripts/release.py verify
      id: target
      env:
        TARGET_TAG: ${{ inputs.tag || github.ref_name }}
        EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          os: ubuntu-24.04
          archive: tdsl-linux-x86_64.tar.gz
          use_cross: true
        - target: aarch64-unknown-linux-musl
          os: ubuntu-24.04
          archive: tdsl-linux-aarch64.tar.gz
          use_cross: true
        - target: x86_64-apple-darwin
          os: macos-latest
          archive: tdsl-macos-x86_64.tar.gz
          use_cross: false
        - target: aarch64-apple-darwin
          os: macos-latest
          archive: tdsl-macos-aarch64.tar.gz
          use_cross: false
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          archive: tdsl-windows-x86_64.zip
          use_cross: false
      fail-fast: false
    steps:
    - name: Checkout verified source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.verify.outputs.sha }}
        path: source
        persist-credentials: false
        fetch-depth: 0
    - name: Install Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: '1.94'
        targets: ${{ matrix.target }}
    - name: Ensure target installed
      if: '!matrix.use_cross'
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: rustup target add "$TARGET"
    - name: Cache Cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: ${{ matrix.target }}
        workspaces: source
    - name: Install cross
      if: matrix.use_cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Build (cross)
      if: matrix.use_cross
      run: cross build --release --target ${{ matrix.target }} -p tdsl-cli
    - name: Build (cargo)
      if: '!matrix.use_cross'
      run: cargo build --release --target ${{ matrix.target }} -p tdsl-cli
    - name: Strip binary (macOS)
      if: '!matrix.use_cross && matrix.os == ''macos-latest'''
      run: strip target/${{ matrix.target }}/release/tdsl
    - name: Create archive (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release tdsl
    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Compress-Archive -Path target\${{ matrix.target }}\release\tdsl.exe -DestinationPath ${{ matrix.archive }}
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ matrix.archive }}
        path: source/${{ matrix.archive }}
    needs:
    - verify
    defaults:
      run:
        working-directory: source
  build-wasm:
    needs: &id001
    - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET_TAG: ${{ needs.verify.outputs.tag }}
      TARGET_SHA: ${{ needs.verify.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout release orchestration
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: automation
        persist-credentials: false
    - name: Checkout verified source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.verify.outputs.sha }}
        path: source
        persist-credentials: false
        fetch-depth: 0
    - name: Install Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: '1.94'
    - name: Cache Cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: wasm
        workspaces: source
    - name: Install wasm-pack
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
      with:
        tool: wasm-pack@0.14.0
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        registry-url: https://registry.npmjs.org
    - name: Build WASM (web target)
      run: wasm-pack build crates/tdsl-wasm --target web --release --scope keroway
    - name: "Smoke test \u2014 check_source returns JSON array"
      run: "node -e \"\nconst {readFileSync} = require('fs');\n// Minimal smoke: ensure the generated JS module\
        \ exports the expected symbols\nconst js = readFileSync('crates/tdsl-wasm/pkg/tdsl_wasm.js', 'utf8');\n\
        // apps/webui/src/worker/tdsl.worker.ts \u306E @keroway/tdsl-wasm import \u4E00\u89A7\u3068\u540C\u671F\u3055\
        \u305B\u308B\u3053\u3068\u3002\n['compile_to_ir', 'render_svg_from_source', 'render_svg_from_source_with_options',\
        \ 'render_html_from_source', 'render_html_from_source_with_options', 'check_source', 'lint_source', 'lint_fix_source',\
        \ 'format_source', 'JsRenderOptions']\n  .forEach(fn => { if (!js.includes(fn)) throw new Error('Missing\
        \ export: ' + fn); });\nconsole.log('WASM smoke test passed');\n\"\n"
    - name: Verify and stamp npm package
      run: python3 "$GITHUB_WORKSPACE/automation/scripts/release.py" stamp crates/tdsl-wasm/pkg
    - name: Package WASM bundle
      run: |-
        cp crates/tdsl-wasm/README.md crates/tdsl-wasm/pkg/README.md
        cp LICENSE crates/tdsl-wasm/pkg/LICENSE
        tar czf "tdsl-wasm-${TARGET_TAG}.tar.gz" -C crates/tdsl-wasm/pkg tdsl_wasm.js tdsl_wasm.d.ts tdsl_wasm_bg.wasm tdsl_wasm_bg.wasm.d.ts package.json README.md LICENSE release-source.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: tdsl-wasm-${{ needs.verify.outputs.tag }}.tar.gz
        path: source/tdsl-wasm-${{ needs.verify.outputs.tag }}.tar.gz
    defaults:
      run:
        working-directory: source
    name: Build WASM package
  publish-npm:
    needs:
    - verify
    - build-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_TAG: ${{ needs.verify.outputs.tag }}
      TARGET_SHA: ${{ needs.verify.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout release orchestration
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: automation
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: tdsl-wasm-${{ needs.verify.outputs.tag }}.tar.gz
        path: artifacts
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        registry-url: https://registry.npmjs.org
    - name: Verify existing npm distribution
      run: python3 "$GITHUB_WORKSPACE/automation/scripts/release.py" pending npm
      id: pending
    - name: Publish missing npm version
      run: |-
        npm install -g npm@latest
        mkdir package
        tar xzf "artifacts/tdsl-wasm-${TARGET_TAG}.tar.gz" -C package
        cd package
        npm publish --access public
      if: steps.pending.outputs.pending == 'true'
    name: Publish npm
    concurrency:
      group: npm-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
  publish-crates:
    needs: *id001
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_TAG: ${{ needs.verify.outputs.tag }}
      TARGET_SHA: ${{ needs.verify.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout release orchestration
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: automation
        persist-credentials: false
    - name: Checkout verified source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.verify.outputs.sha }}
        path: source
        persist-credentials: false
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: '1.94'
    - name: Verify published crate identities
      run: python3 "$GITHUB_WORKSPACE/automation/scripts/release.py" pending tdsl-parser tdsl-wikidata tdsl-core
        tdsl-render
      id: pending
    - name: Authenticate to crates.io
      if: steps.pending.outputs.pending == 'true'
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth
    - name: Publish only missing crates
      run: |-
        read -r -a packages <<< "$PENDING_PACKAGES"
        args=()
        for package in "${packages[@]}"; do args+=(-p "$package"); done
        cargo publish "${args[@]}" --locked
      if: steps.pending.outputs.pending == 'true'
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        PENDING_PACKAGES: ${{ steps.pending.outputs.packages }}
    defaults:
      run:
        working-directory: source
    name: Publish crates.io
    concurrency:
      group: crates-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
  release:
    needs:
    - verify
    - build
    - build-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TARGET_TAG: ${{ needs.verify.outputs.tag }}
      TARGET_SHA: ${{ needs.verify.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout release orchestration
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: automation
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: artifacts
        merge-multiple: true
    - name: Publish or verify existing archives
      run: python3 "$GITHUB_WORKSPACE/automation/scripts/release.py" assets artifacts/tdsl-linux-x86_64.tar.gz artifacts/tdsl-linux-aarch64.tar.gz
        artifacts/tdsl-macos-x86_64.tar.gz artifacts/tdsl-macos-aarch64.tar.gz artifacts/tdsl-windows-x86_64.zip
        "artifacts/tdsl-wasm-${TARGET_TAG}.tar.gz"
    name: GitHub archives
    concurrency:
      group: release-assets-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
  update-homebrew-formula:
    needs:
    - verify
    - release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET_TAG: ${{ needs.verify.outputs.tag }}
      TARGET_SHA: ${{ needs.verify.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout release orchestration
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: automation
        persist-credentials: false
    - name: Verify tap and reuse existing PR
      run: python3 "$GITHUB_WORKSPACE/automation/scripts/release.py" homebrew
      id: tap
    - name: Require tap token
      run: test -n "$TAP_BUMP_TOKEN"
      if: steps.tap.outputs.skip != 'true'
      env:
        TAP_BUMP_TOKEN: ${{ secrets.TAP_BUMP_TOKEN }}
    - name: Checkout tap
      if: steps.tap.outputs.skip != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: keroway/homebrew-tap
        token: ${{ secrets.TAP_BUMP_TOKEN }}
        path: homebrew-tap
        persist-credentials: true
    - name: Generate formula
      run: |-
        bash automation/scripts/generate-homebrew-formula.sh
        bash automation/scripts/test-homebrew-formula-generation.sh --check-only homebrew-tap/Formula/tdsl.rb
      if: steps.tap.outputs.skip != 'true'
      env:
        VERSION: ${{ needs.verify.outputs.tag }}
        SHA_LINUX: ${{ steps.tap.outputs.SHA_LINUX }}
        SHA_LINUX_ARM: ${{ steps.tap.outputs.SHA_LINUX_ARM }}
        SHA_MACOS_X86: ${{ steps.tap.outputs.SHA_MACOS_X86 }}
        SHA_MACOS_ARM: ${{ steps.tap.outputs.SHA_MACOS_ARM }}
        OUTPUT_PATH: homebrew-tap/Formula/tdsl.rb
    - name: Create or reuse bump branch and PR
      run: bash "$GITHUB_WORKSPACE/automation/scripts/release-homebrew.sh"
      if: steps.tap.outputs.skip != 'true'
      working-directory: homebrew-tap
      env:
        GH_TOKEN: ${{ secrets.TAP_BUMP_TOKEN }}
    name: Homebrew bump PR
    concurrency:
      group: homebrew-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
  status:
    needs:
    - verify
    - build
    - build-wasm
    - publish-npm
    - publish-crates
    - release
    - update-homebrew-formula
    if: always() && needs.verify.result == 'success'
    uses: ./.github/workflows/release-status.yml
    permissions:
      contents: write
      actions: read
    with:
      tag: ${{ needs.verify.outputs.tag }}
      sha: ${{ needs.verify.outputs.sha }}
