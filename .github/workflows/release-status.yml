# Publication uses only a verified existing tag SHA. Keep destination failures visible.
name: Recheck release distributions
'on':
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to retry (vX.Y.Z); no version rewriting
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  inventory:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: release-status-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify existing tag
      run: python3 scripts/release.py verify
      id: target
      env:
        TARGET_TAG: ${{ inputs.tag }}
        EXPECTED_SHA: ${{ inputs.sha || '' }}
    - name: Reconcile live distribution status
      run: python3 scripts/release.py status
      env:
        TARGET_TAG: ${{ steps.target.outputs.tag }}
        TARGET_SHA: ${{ steps.target.outputs.sha }}
        GH_TOKEN: ${{ github.token }}
