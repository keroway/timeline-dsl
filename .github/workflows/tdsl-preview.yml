name: TDSL Preview

on:
  pull_request:
    paths:
      - "**/*.tdsl"

permissions:
  contents: read
  pull-requests: write

jobs:
  render-preview:
    name: Render SVG Preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA ピン。toolchain は with: で指定)
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: tdsl-preview

      - name: Build tdsl CLI
        run: cargo build --release -p tdsl-cli

      - name: Render changed .tdsl files and collect IR summary
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p preview

          changed_files=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep '\.tdsl$' || true)

          summary_entries='[]'

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue

            name=$(basename "$file" .tdsl)
            echo "Rendering: $file -> preview/${name}.svg"
            render_failed=false
            render_error=""
            if ! render_error=$(./target/release/tdsl render --format svg --offline -o "preview/${name}.svg" "$file" 2>&1 >/dev/null); then
              render_failed=true
              echo "WARNING: failed to render $file"
              echo "$render_error"
            fi

            echo "Building IR for: $file"
            build_failed=false
            build_error=""
            if ! ir_json=$(./target/release/tdsl build --pretty --offline "$file" 2>/tmp/build_stderr); then
              build_failed=true
              build_error=$(cat /tmp/build_stderr)
              ir_json='{}'
              echo "WARNING: failed to build IR for $file"
              echo "$build_error"
            fi

            items=$(echo "$ir_json" | jq '.items | length // 0')
            lanes=$(echo "$ir_json" | jq '.lanes | length // 0')
            range_start=$(echo "$ir_json" | jq '.meta.range[0] // "N/A"')
            range_end=$(echo "$ir_json" | jq '.meta.range[1] // "N/A"')

            entry=$(jq -n \
              --arg file "$file" \
              --arg name "$name" \
              --argjson items "$items" \
              --argjson lanes "$lanes" \
              --argjson range_start "$range_start" \
              --argjson range_end "$range_end" \
              --argjson render_failed "$render_failed" \
              --argjson build_failed "$build_failed" \
              --arg render_error "$render_error" \
              --arg build_error "$build_error" \
              '{file: $file, name: $name, items: $items, lanes: $lanes, range_start: $range_start, range_end: $range_end, render_failed: $render_failed, build_failed: $build_failed, render_error: $render_error, build_error: $build_error}')

            summary_entries=$(echo "$summary_entries" | jq --argjson entry "$entry" '. + [$entry]')
          done <<< "$changed_files"

          echo "$summary_entries" > preview/summary.json
          echo "Summary written to preview/summary.json"
          cat preview/summary.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tdsl-preview-svg
          path: preview/
          if-no-files-found: warn

      - name: Post preview comment to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const BOT_TAG = '<!-- tdsl-preview-bot -->';

            // summary.json を読み込む
            let summaryEntries = [];
            try {
              const raw = fs.readFileSync('preview/summary.json', 'utf8');
              summaryEntries = JSON.parse(raw);
            } catch (e) {
              console.warn('Failed to read preview/summary.json:', e.message);
            }

            // 変更ファイル一覧
            const changedFiles = summaryEntries.map(e => `- \`${e.file}\``).join('\n') || '_(変更された .tdsl ファイルなし)_';

            // IR サマリテーブル
            let summaryTable = '';
            if (summaryEntries.length > 0) {
              const rows = summaryEntries.map(e => {
                if (e.build_failed) {
                  return `| \`${e.file}\` | ⚠️ ビルド失敗 | - | - |`;
                }
                const range = (typeof e.range_start === 'number' && typeof e.range_end === 'number')
                  ? `${e.range_start} 〜 ${e.range_end}`
                  : 'N/A';
                const renderNote = e.render_failed ? ' ⚠️ レンダリング失敗' : '';
                return `| \`${e.file}\`${renderNote} | ${e.items} | ${e.lanes} | ${range} |`;
              }).join('\n');
              summaryTable = `| ファイル | アイテム数 | レーン数 | 期間 |\n|---|---|---|---|\n${rows}`;

              const failures = summaryEntries.filter(e => e.build_failed || e.render_failed);
              if (failures.length > 0) {
                const details = failures.map(e => {
                  const lines = [`<details><summary>⚠️ \`${e.file}\` のエラー詳細</summary>`, ''];
                  if (e.build_failed) {
                    lines.push('**build エラー:**', '```', (e.build_error || '(no output)').slice(0, 2000), '```');
                  }
                  if (e.render_failed) {
                    lines.push('**render エラー:**', '```', (e.render_error || '(no output)').slice(0, 2000), '```');
                  }
                  lines.push('</details>');
                  return lines.join('\n');
                }).join('\n\n');
                summaryTable += `\n\n${details}`;
              }
            } else {
              summaryTable = '_(IR サマリなし)_';
            }

            // アーティファクト DL リンク
            const artifactUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // 最終更新日時 (UTC)
            const now = new Date().toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');

            const body = [
              BOT_TAG,
              '## TDSL プレビュー',
              '',
              '### 変更ファイル',
              changedFiles,
              '',
              '### IR サマリ',
              summaryTable,
              '',
              '### アーティファクト',
              'SVG ファイルは以下のワークフロー実行ページからダウンロードできます:',
              `[tdsl-preview-svg をダウンロード](${artifactUrl})`,
              '',
              '---',
              `_最終更新: ${now}_`,
            ].join('\n');

            const prNumber = context.payload.pull_request.number;

            // 既存コメントを検索（30件超の長寿命 PR でも bot コメントを見失わないよう全件走査）
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body && c.body.includes(BOT_TAG));

            if (existing) {
              console.log(`Updating existing comment #${existing.id}`);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              console.log('Creating new comment');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
