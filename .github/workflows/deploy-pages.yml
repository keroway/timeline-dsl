name: Deploy WebUI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/webui/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/webui/package-lock.json

      - name: Install dependencies
        working-directory: apps/webui
        run: npm ci

      - name: Build
        working-directory: apps/webui
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/webui/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # actions/deploy-pages occasionally fails the final status-poll with a
      # transient backend error ("Deployment failed, try again later") even
      # though the deployment itself succeeded; retrying once resolves it.
      # See plans/010-harden-github-pages-deploy.md.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Surface deploy URL
        if: steps.deploy1.outcome == 'success'
        run: echo "Deployed at ${{ steps.deploy1.outputs.page_url }}"
