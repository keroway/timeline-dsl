name: Deploy WebUI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/webui/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: apps/webui/package-lock.json

      - name: Install dependencies
        working-directory: apps/webui
        run: npm ci

      - name: Build
        working-directory: apps/webui
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/webui/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      # actions/deploy-pages occasionally fails the final status-poll with a
      # transient backend error ("Deployment failed, try again later") even
      # though the deployment itself succeeded; retrying once resolves it.
      # See plans/010-harden-github-pages-deploy.md.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Surface deploy URL
        if: steps.deploy1.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.deploy1.outputs.page_url }}
        run: echo "Deployed at $PAGE_URL"
