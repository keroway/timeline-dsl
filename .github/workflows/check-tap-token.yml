name: Check TAP_BUMP_TOKEN

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-tap-token
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - name: Checkout tap using the token under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keroway/homebrew-tap
          token: ${{ secrets.TAP_BUMP_TOKEN }}
          path: tap
          persist-credentials: true
      - name: Verify push and PR permissions, then clean up
        run: bash "$GITHUB_WORKSPACE/automation/scripts/check-tap-token.sh"
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.TAP_BUMP_TOKEN }}
