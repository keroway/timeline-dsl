name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Unit tests
        run: cargo test --workspace --all-targets

      - name: E2E smoke
        run: bash scripts/e2e-smoke.sh

  build-webui:
    name: Build WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/webui/package-lock.json

      - name: Install dependencies
        working-directory: apps/webui
        run: npm ci

      - name: Lint
        working-directory: apps/webui
        run: npm run lint

      - name: Test
        working-directory: apps/webui
        run: npm test

      - name: Build
        working-directory: apps/webui
        run: npm run build

      - name: Check tmLanguage.json drift
        run: |
          node editors/vscode/scripts/gen-grammar-keywords.mjs
          if ! git diff --exit-code -- editors/vscode/syntaxes/tdsl.tmLanguage.json; then
            echo "::error file=editors/vscode/syntaxes/tdsl.tmLanguage.json::tdsl.tmLanguage.json is out of sync with apps/webui/src/lang-tdsl/keywords.ts. Run \`cd apps/webui && npm run build\` (or \`node editors/vscode/scripts/gen-grammar-keywords.mjs\`) and commit the regenerated file."
            exit 1
          fi

  test-vscode-extension:
    name: Test VS Code extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Test
        working-directory: editors/vscode
        run: npm test

      - name: Compile
        working-directory: editors/vscode
        run: npm run compile

  bench-compile:
    name: Bench (compile only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compile benchmarks
        run: cargo bench --no-run

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee bench-output.txt

      - name: Upload criterion reports
        uses: actions/upload-artifact@v7
        with:
          name: criterion-reports-${{ github.sha }}
          path: |
            target/criterion/
            bench-output.txt
          retention-days: 90

  build-wasm-check:
    name: WASM build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-check

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: Build WASM
        run: wasm-pack build crates/tdsl-wasm --target web

      - name: Verify exports
        run: |
          node -e "
          const js = require('fs').readFileSync('crates/tdsl-wasm/pkg/tdsl_wasm.js', 'utf8');
          ['compile_to_ir', 'render_svg_from_source', 'render_html_from_source', 'check_source', 'lint_source', 'lint_fix_source']
            .forEach(fn => { if (!js.includes(fn)) throw new Error('Missing export: ' + fn); });
          console.log('All expected exports found');
          "

      - name: Build WASM for apps/webui (drift check)
        run: wasm-pack build crates/tdsl-wasm --target web --out-dir /tmp/webui-wasm-check --no-opt

      - name: Check apps/webui/src/wasm artifacts are up to date
        run: |
          # Compare the JS-visible API surface byte-for-byte. tdsl_wasm_bg.wasm
          # itself is intentionally excluded from the byte diff: --no-opt builds
          # embed absolute toolchain/registry/checkout paths (debug info), so a
          # developer's local rebuild will never byte-match a CI rebuild even
          # when semantically identical. README.md/.gitignore are excluded too
          # since apps/webui/src/wasm/.gitignore untracks them.
          status=0
          for f in package.json tdsl_wasm.js tdsl_wasm.d.ts tdsl_wasm_bg.wasm.d.ts; do
            if ! diff -u "apps/webui/src/wasm/$f" "/tmp/webui-wasm-check/$f"; then
              status=1
            fi
          done

          # For the .wasm binary, compare only the exported symbol set (immune to
          # embedded build-path differences) so real API drift is still caught.
          node -e "
          const fs = require('fs');
          async function exportNames(path) {
            const mod = await WebAssembly.compile(fs.readFileSync(path));
            return WebAssembly.Module.exports(mod).map((e) => e.name).sort();
          }
          (async () => {
            const committed = await exportNames('apps/webui/src/wasm/tdsl_wasm_bg.wasm');
            const fresh = await exportNames('/tmp/webui-wasm-check/tdsl_wasm_bg.wasm');
            const committedSet = new Set(committed);
            const freshSet = new Set(fresh);
            const missing = fresh.filter((n) => !committedSet.has(n));
            const extra = committed.filter((n) => !freshSet.has(n));
            if (missing.length || extra.length) {
              if (missing.length) console.error('Missing from committed tdsl_wasm_bg.wasm: ' + missing.join(', '));
              if (extra.length) console.error('Unexpected (stale) export in committed tdsl_wasm_bg.wasm: ' + extra.join(', '));
              process.exit(1);
            }
            console.log('tdsl_wasm_bg.wasm exports match (' + committed.length + ' exports).');
          })();
          " || status=1

          if [ "$status" -ne 0 ]; then
            echo "::error::apps/webui/src/wasm/ is out of sync with crates/tdsl-wasm. Rebuild with: wasm-pack build crates/tdsl-wasm --target web --out-dir apps/webui/src/wasm --no-opt (then commit the regenerated files)."
            exit 1
          fi

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov --workspace --all-targets --summary-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --workspace --all-targets
