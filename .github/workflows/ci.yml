name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA ピン。toolchain は with: で指定)
        with:
          toolchain: "1.94"
          # clippy は既定で入らないため明示する（#781）。
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format check
        run: cargo fmt --all -- --check

      # justfile の `lint` / `check` タスクと**同一のコマンド**にすること。
      # 乖離すると「ローカルで通るのに CI で落ちる」（またはその逆）が起きる。
      #
      # `--features wikidata` は付けない。`wikidata` は `tdsl-core` の
      # **default feature** であり（`crates/tdsl-core/Cargo.toml` の
      # `default = ["wikidata"]`）、既定でも `#[cfg(feature = "wikidata")]` の
      # コードはコンパイル・検査される。実際に wikidata 限定コードへ違反を
      # 仕込んで、既定のコマンドで検出されることを確認済み（#781）。
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --all-targets

      - name: E2E smoke
        run: bash scripts/e2e-smoke.sh

  build-webui:
    name: Build WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: apps/webui/package-lock.json

      - name: Install dependencies
        working-directory: apps/webui
        run: npm ci

      - name: Lint
        working-directory: apps/webui
        run: npm run lint

      - name: Format check
        working-directory: apps/webui
        run: npm run format:check

      - name: Test
        working-directory: apps/webui
        run: npm test

      - name: Build
        working-directory: apps/webui
        run: npm run build

      - name: Check tmLanguage.json drift
        run: |
          node editors/vscode/scripts/gen-grammar-keywords.mjs
          if ! git diff --exit-code -- editors/vscode/syntaxes/tdsl.tmLanguage.json; then
            echo "::error file=editors/vscode/syntaxes/tdsl.tmLanguage.json::tdsl.tmLanguage.json is out of sync with apps/webui/src/lang-tdsl/keywords.ts. Run \`cd apps/webui && npm run build\` (or \`node editors/vscode/scripts/gen-grammar-keywords.mjs\`) and commit the regenerated file."
            exit 1
          fi

  test-vscode-extension:
    name: Test VS Code extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Typecheck
        working-directory: editors/vscode
        run: npm run typecheck

      - name: Test
        working-directory: editors/vscode
        run: npm test

      - name: Compile
        working-directory: editors/vscode
        run: npm run compile

  bench-compile:
    name: Bench (compile only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA ピン。toolchain は with: で指定)
        with:
          toolchain: "1.94"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Compile benchmarks
        run: cargo bench --no-run

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA ピン。toolchain は with: で指定)
        with:
          toolchain: "1.94"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: bench

      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee bench-output.txt

      - name: Upload criterion reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-reports-${{ github.sha }}
          path: |
            target/criterion/
            bench-output.txt
          retention-days: 90

  build-wasm-check:
    name: WASM build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA ピン。toolchain は with: で指定)
        with:
          toolchain: "1.94"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: wasm-check

      - name: Install wasm-pack
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: wasm-pack@0.14.0

      - name: Build WASM
        run: wasm-pack build crates/tdsl-wasm --target web

      - name: Verify exports
        run: |
          node -e "
          const js = require('fs').readFileSync('crates/tdsl-wasm/pkg/tdsl_wasm.js', 'utf8');
          ['compile_to_ir', 'render_svg_from_source', 'render_html_from_source', 'check_source', 'lint_source', 'lint_fix_source']
            .forEach(fn => { if (!js.includes(fn)) throw new Error('Missing export: ' + fn); });
          console.log('All expected exports found');
          "

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA ピン。toolchain は with: で指定)
        with:
          toolchain: "1.94"
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov --workspace --all-targets --summary-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA ピン。toolchain は with: で指定)
        with:
          toolchain: "1.94"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Unit tests
        run: cargo test --workspace --all-targets
