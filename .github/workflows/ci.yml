name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --workspace --all-targets

      - name: E2E smoke
        run: bash scripts/e2e-smoke.sh

  build-webui:
    name: Build WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/webui/package-lock.json

      - name: Install dependencies
        working-directory: apps/webui
        run: npm ci

      - name: Lint
        working-directory: apps/webui
        run: npm run lint

      - name: Test
        working-directory: apps/webui
        run: npm test

      - name: Build
        working-directory: apps/webui
        run: npm run build

      - name: Check tmLanguage.json drift
        run: |
          node editors/vscode/scripts/gen-grammar-keywords.mjs
          if ! git diff --exit-code -- editors/vscode/syntaxes/tdsl.tmLanguage.json; then
            echo "::error file=editors/vscode/syntaxes/tdsl.tmLanguage.json::tdsl.tmLanguage.json is out of sync with apps/webui/src/lang-tdsl/keywords.ts. Run \`cd apps/webui && npm run build\` (or \`node editors/vscode/scripts/gen-grammar-keywords.mjs\`) and commit the regenerated file."
            exit 1
          fi

  bench-compile:
    name: Bench (compile only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compile benchmarks
        run: cargo bench --no-run

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee bench-output.txt

      - name: Upload criterion reports
        uses: actions/upload-artifact@v7
        with:
          name: criterion-reports-${{ github.sha }}
          path: |
            target/criterion/
            bench-output.txt
          retention-days: 90

  build-wasm-check:
    name: WASM build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-check

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: Build WASM
        run: wasm-pack build crates/tdsl-wasm --target web

      - name: Verify exports
        run: |
          node -e "
          const js = require('fs').readFileSync('crates/tdsl-wasm/pkg/tdsl_wasm.js', 'utf8');
          ['compile_to_ir', 'render_svg_from_source', 'render_html_from_source', 'check_source', 'lint_source', 'lint_fix_source']
            .forEach(fn => { if (!js.includes(fn)) throw new Error('Missing export: ' + fn); });
          console.log('All expected exports found');
          "

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov --workspace --all-targets --summary-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --workspace --all-targets
